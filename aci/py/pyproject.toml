[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aci-spec"
version = "0.1.0"
description = "Agent Interaction Specification — schema and validation for ACI manifests"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ACI Contributors" }
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/nousresearch/agent-interaction-specs"
Repository = "https://github.com/nousresearch/agent-interaction-specs"

[tool.setuptools.packages.find]
where = ["src"]
